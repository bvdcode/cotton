name: CI

on:
  push:
    paths:
      - "src/**"
      - "GitVersion.yml"
      - ".github/workflows/**"
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      backend: ${{ steps.select.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select checks for changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          frontend=false
          backend=false
          if [[ "$GITHUB_REF" == 'refs/heads/main' || "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || "$BASE_SHA" == '0000000000000000000000000000000000000000' ]]; then
            frontend=true
            backend=true
          else
            git diff --name-only --no-renames -z "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' file; do
              case "$file" in
                src/cotton.client/*) frontend=true ;;
                src/*) backend=true ;;
                .github/workflows/*|GitVersion.yml) frontend=true; backend=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          printf 'Frontend checks: %s\nBackend checks: %s\n' "$frontend" "$backend" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: src/cotton.client/.nvmrc
          cache: npm
          cache-dependency-path: src/cotton.client/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/cotton.client
        run: npm ci

      - name: Check frontend locales
        working-directory: src/cotton.client
        run: npm run i18n:check

      - name: Run frontend tests
        working-directory: src/cotton.client
        run: npm test

      - name: Lint, type-check and build frontend
        working-directory: src/cotton.client
        run: npm run build

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: check repository
        uses: actions/checkout@v5
        with:
          lfs: "true"
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: src/cotton.client/.nvmrc
          cache: npm
          cache-dependency-path: src/cotton.client/package-lock.json

      - name: Validate SixLabors license secret
        run: |
          if [ -z "${SIXLABORS_LICENSE:-}" ]; then
            echo "SIXLABORS_LICENSE secret is required for builds and tests." >&2
            exit 1
          fi

      - name: Restore .NET dependencies
        run: dotnet restore src/Cotton.sln

      - name: Install frontend dependencies
        working-directory: src/cotton.client
        run: npm ci

      - name: Install PostgreSQL backup tools
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          sudo chmod a+r /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Install preview rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg f3d xvfb xauth libosmesa6 libgl1 libgl1-mesa-dri libegl1 libglx-mesa0
          f3d --version
          xvfb-run --help >/dev/null
          ffmpeg -version

      - name: Run backend tests
        run: dotnet test src/Cotton.sln --configuration Release --no-restore --logger "console;verbosity=normal" --logger trx --results-directory TestResults

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  publish-develop:
    name: Publish develop
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/publish-artifacts.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  publish-main:
    name: Publish main
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-artifacts.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: publish-main
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download NuGet package artifact
        if: needs.publish-main.outputs.CommitsSinceVersionSource > 0
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      - name: Create Release
        if: needs.publish-main.outputs.CommitsSinceVersionSource > 0
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.publish-main.outputs.Version }}
          name: Release ${{ needs.publish-main.outputs.Version }}
          body: ${{ github.event.head_commit.message }}
          artifacts: "nupkg/*"
          token: ${{ secrets.GITHUB_TOKEN }}
